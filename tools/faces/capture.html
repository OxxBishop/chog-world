<!doctype html><meta charset="utf-8"><title>facecap</title>
<script type="module">
// Temporary tool: a front, unlit, orthographic capture of a model's face in its bind pose, plus the
// projection that maps the mesh's own vertex positions onto that picture.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const name = q.get('m') || 'plain';
const PX = 1024;
const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('/models/npcs/' + name + '.glb');
const root = g.scene;
root.updateMatrixWorld(true);
const scene = new THREE.Scene();
let mesh = null;
root.traverse((o) => { if (o.isMesh && (!mesh || o.geometry.attributes.position.count > mesh.geometry.attributes.position.count)) mesh = o; });
// Unskinned copies in the bind pose: exactly the vertex positions the in-game shader projects.
root.traverse((o) => {
  if (!o.isMesh) return;
  const m = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ map: o.material.map, side: THREE.FrontSide }));
  m.matrixAutoUpdate = false; m.matrix.copy(o.matrixWorld); scene.add(m);
});
// Bind pose: the skinned mesh as bound (no clip applied). Its vertices in scene space:
const pos = mesh.geometry.attributes.position;
const head = root.getObjectByName('Head');
const neck = root.getObjectByName('Neck');
const hp = head.getWorldPosition(new THREE.Vector3());
const np = neck.getWorldPosition(new THREE.Vector3());
const v = new THREE.Vector3();
const box = new THREE.Box3();
const skin = mesh.geometry.attributes.skinIndex, wts = mesh.geometry.attributes.skinWeight;
const headIdx = mesh.skeleton.bones.indexOf(head);
for (let i = 0; i < pos.count; i++) {
  // vertices mostly bound to the head bone
  let w = 0;
  for (let k = 0; k < 4; k++) if (skin.getComponent(i, k) === headIdx) w += wts.getComponent(i, k);
  if (w < 0.5) continue;
  v.fromBufferAttribute(pos, i);
  v.applyMatrix4(mesh.matrixWorld);
  box.expandByPoint(v);
}
const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
// A square frame on the head, from the front (+z looking toward -z).
// The sniffer faces -x (toward its flowers); everyone else faces +z.
const side = q.get('dir') === 'x-';
const half = Math.max(side ? size.z : size.x, size.y) * 0.5 * 1.02;
const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.001, Math.max(size.x, size.z) * 2 + 2);
if (side) { cam.position.set(box.min.x - 1, c.y, c.z); cam.lookAt(box.max.x, c.y, c.z); }
else { cam.position.set(c.x, c.y, box.max.z + 1); cam.lookAt(c.x, c.y, box.min.z); }
cam.updateMatrixWorld(true);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
r.setSize(PX, PX);
r.outputColorSpace = THREE.SRGBColorSpace;
r.setClearColor(0x000000, 0);
r.render(scene, cam);
// Depth from the front, to find the face surface in the picture.
const depthMat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
scene.overrideMaterial = depthMat;
const rt = new THREE.WebGLRenderTarget(256, 256);
r.setRenderTarget(rt); r.setClearColor(0xffffff, 1); r.clear(); r.render(scene, cam); r.setRenderTarget(null);
const dbuf = new Uint8Array(256 * 256 * 4); r.readRenderTargetPixels(rt, 0, 0, 256, 256, dbuf);
// mesh-local -> picture: P * V * meshWorld
const M = new THREE.Matrix4().multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse).multiply(mesh.matrixWorld);
window.__done = JSON.stringify({
  name, mesh: mesh.name, png: r.domElement.toDataURL('image/png').split(',')[1],
  depth: btoa(String.fromCharCode(...dbuf.filter((_, i) => i % 4 === 0).slice(0, 65536))),
  matrix: M.toArray(), cam: { near: cam.near, far: cam.far, z: cam.position.z, half, cx: c.x, cy: c.y },
  head: hp.toArray(), neck: np.toArray(), box: [box.min.toArray(), box.max.toArray()], verts: pos.count,
  meshWorld: mesh.matrixWorld.toArray(), headIdx,
});
</script>

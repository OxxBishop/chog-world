<!doctype html><meta charset="utf-8"><title>Anim bench</title>
<style>body{margin:0;background:#222;color:#eee;font:12px sans-serif}</style>
<canvas id="c"></canvas><pre id="log"></pre>
<script type="module">
// A library clip retargeted onto a Chog (tools/models/retarget.js), walked across a checkered floor at
// speed x the clip's own ground speed so sliding feet show. ?src=ual|kk&clip=Walk_Loop&m=chog-1151
// &rate=1 (playback rate)&speed=<m/s world, default: matched to the stride>&ts=..&v=side|front|back|q&size=
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';
import { MeshoptDecoder } from 'meshoptimizer';
import { retarget, MAPS } from '/tools/models/retarget.js';
const q = new URLSearchParams(location.search);
const srcName = q.get('src') || 'ual';
const SRC = { ual2: { file: '/models/_wip/src/ual2.glb', rest: 'A_TPose', toe: 'ball_l' }, ual: { file: '/models/_wip/src/ual.glb', rest: q.has('rest') ? q.get('rest') : 'A_TPose', toe: 'DEF-toe.L' }, kk: { file: '/models/_wip/src/kk.glb', rest: q.get('rest') || null, toe: 'toes.l' } }[srcName];
const clipName = q.get('clip') || 'Walk_Loop';
const name = q.get('m') || 'chog-1151';
const rate = +(q.get('rate') || 1);
const ts = (q.get('ts') || '1,1.05,1.1,1.15,1.2,1.25,1.3,1.35').split(',').map(Number);
const view = q.get('v') || 'side';
const S = +(q.get('size') || 220), SC = 1.7;
const cols = +(q.get('cols') || ts.length), rows = Math.ceil(ts.length / cols);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1);
r.setSize(S * cols, S * 1.2 * rows);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
r.setScissorTest(true);
r.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#a9b8cc');
scene.add(new THREE.HemisphereLight('#ffffff', '#6a6280', 1.3));
const sun = new THREE.DirectionalLight('#fff4e6', 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun, sun.target);
const c = document.createElement('canvas');
c.width = c.height = 256;
const g = c.getContext('2d');
for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { g.fillStyle = (i + j) % 2 ? '#e2dcef' : '#b6aed0'; g.fillRect(i * 32, j * 32, 32, 32); }
const tex = new THREE.CanvasTexture(c);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(50, 50);
tex.colorSpace = THREE.SRGBColorSpace;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const [sg, dg] = await Promise.all([loader.loadAsync(SRC.file), loader.loadAsync(`/models/${q.get('dir') || 'npcs'}/${name}.glb`)]);
const src = cloneSkinned(sg.scene);
const model = cloneSkinned(dg.scene);
const srcClip = sg.animations.find((a) => a.name === clipName);
const restClip = SRC.rest ? sg.animations.find((a) => a.name === SRC.rest) : null;
const amp = q.has('amp') ? Object.fromEntries(q.get('amp').split(';').map((kv) => kv.split('=')).map(([k, v]) => [k, +v])) : null;
const clip = retarget({ src, srcClip, srcRest: restClip, map: MAPS[srcName], dst: model, name: 'X', srcToe: SRC.toe, armsOut: +(q.get('arms') ?? 0.12), amp });
model.traverse((o) => o.isMesh && ((o.castShadow = true), (o.frustumCulled = false)));
const root = new THREE.Group();
root.add(model);
root.scale.setScalar(SC);
scene.add(root);
const mixer = new THREE.AnimationMixer(model);
const act = mixer.clipAction(clip);
act.timeScale = rate;
act.play();
// The clip's own ground speed: how fast a planted foot slides back (model units/s at rate 1).
function groundSpeed() {
  const m2 = new THREE.AnimationMixer(model);
  const a = m2.clipAction(clip); a.play();
  const feet = ['FootL', 'FootR'].map((n) => model.getObjectByName(n));
  let best = 0;
  const N = 90, p = new THREE.Vector3();
  for (const f of feet) {
    const zs = [], ys = [];
    for (let i = 0; i <= N; i++) { m2.setTime((i / N) * clip.duration); model.updateMatrixWorld(true); f.getWorldPosition(p); p.divideScalar(1); zs.push(p.z / SC); ys.push(p.y / SC); }
    const y0 = Math.min(...ys), y1 = Math.max(...ys), low = y0 + (y1 - y0) * 0.33;
    let d = 0, k = 0;
    for (let i = 1; i <= N; i++) if (ys[i] <= low && ys[i - 1] <= low) (d += Math.abs(zs[i] - zs[i - 1])), k++;
    if (k >= 3) best = Math.max(best, d / ((k / N) * clip.duration));
  }
  m2.stopAllAction(); m2.uncacheRoot(model);
  return best;
}
// Debug: each bone's model-space rotation at t=0 against its bind.
const dbg = {};
{
  const bind = {};
  model.updateMatrixWorld(true);
  const inv0 = new THREE.Matrix4().copy(model.matrixWorld).invert();
  const rot = (b) => { const q = new THREE.Quaternion(); new THREE.Matrix4().multiplyMatrices(inv0, b.matrixWorld).decompose(new THREE.Vector3(), q, new THREE.Vector3()); return q; };
  model.traverse((b) => b.isBone && (bind[b.name] = rot(b)));
  const m3 = new THREE.AnimationMixer(model); const a3 = m3.clipAction(clip); a3.play(); m3.setTime(0); model.updateMatrixWorld(true);
  model.traverse((b) => b.isBone && (dbg[b.name] = +(THREE.MathUtils.radToDeg(rot(b).angleTo(bind[b.name]))).toFixed(1)));
  const tr = clip.tracks.find((t) => t.name === 'UpperArmL.quaternion');
  dbg._trackUA = Array.from(tr.values.slice(0, 4)).map((v) => +v.toFixed(3));
  dbg._bindUA = model.getObjectByName('UpperArmL').quaternion.toArray().map((v) => +v.toFixed(3));
  m3.stopAllAction(); m3.uncacheRoot(model);
}
const gs = groundSpeed();
const speed = q.has('speed') ? +q.get('speed') : gs * SC * rate;
const cam = new THREE.PerspectiveCamera(30, 1 / 1.2, 0.1, 200);
const DIR = { side: [1, 0.25, 0], front: [0, 0.25, 1], back: [0, 0.3, -1], q: [0.8, 0.35, 0.6] };
const dt = 1 / 60;
let t = 0;
const lastT = Math.max(...ts);
while (t <= lastT + 1e-6) {
  root.position.set(0, 0, t * speed);
  mixer.update(dt);
  const idx = ts.findIndex((x) => Math.abs(x - t) < dt / 2);
  if (idx >= 0) {
    root.updateMatrixWorld(true);
    const H = 2.2 * SC;
    const look = root.position.clone().add(new THREE.Vector3(0, H * +(q.get('focus') ?? 0.42), 0));
    const d = new THREE.Vector3(...DIR[view]).normalize();
    cam.position.copy(look).addScaledVector(d, (H * 2.4) / +(q.get('zoom') ?? 1));
    cam.lookAt(look);
    sun.position.copy(root.position).add(new THREE.Vector3(6, 12, 8));
    sun.target.position.copy(root.position);
    const col = idx % cols, row = Math.floor(idx / cols), y = (rows - 1 - row) * S * 1.2;
    r.setViewport(col * S, y, S, S * 1.2); r.setScissor(col * S, y, S, S * 1.2);
    r.render(scene, cam);
  }
  t += dt;
}
window.__json = JSON.stringify({ dbg, clips: sg.animations.map((a) => a.name), groundSpeed: +gs.toFixed(3), worldSpeed: +speed.toFixed(2), duration: +srcClip.duration.toFixed(3) });
document.getElementById('log').textContent = window.__json;
requestAnimationFrame(() => (window.__done = r.domElement.toDataURL('image/jpeg', 0.88).split(',')[1]));
</script>

<!doctype html><meta charset="utf-8"><title>Gait bench</title>
<style>body{margin:0;background:#222;color:#eee;font:12px sans-serif}</style>
<canvas id="c"></canvas><pre id="log"></pre>
<script type="module">
// The procedural walk (src/gait.js) on a cast model, on a checkered floor so sliding feet would show.
// ?m=<model>&style=<name>&speed=<m/s at scale 1.7>&state=idle|wave|talk|cheer|sad|sleepy&path=line|circle|stopgo
// &ts=1,1.1,1.2 (frames at these seconds, one column each)&v=side|front|q|back&size=&scale=1.7&rows=<n>
// window.__done: the strip as JPEG (base64).
import * as THREE from 'three';
import { withKtx2 } from '/src/chog.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';
import { MeshoptDecoder } from 'meshoptimizer';
import { createGait, CAST_STYLE } from '/src/gait.js';
const q = new URLSearchParams(location.search);
const name = q.get('m') || 'plain';
const style = q.get('style') || CAST_STYLE[name] || 'neutral';
const speed = +(q.get('speed') ?? 3.6);
const state = q.get('state') || 'walk';
const path = q.get('path') || 'line';
const ts = (q.get('ts') || '1,1.05,1.1,1.15,1.2,1.25,1.3,1.35').split(',').map(Number);
const view = q.get('v') || 'side';
const S = +(q.get('size') || 220);
const SC = +(q.get('scale') || 1.7);
const cols = +(q.get('cols') || ts.length);
const rows = Math.ceil(ts.length / cols);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1);
r.setSize(S * cols, S * 1.2 * rows);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
r.setScissorTest(true);
r.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#a9b8cc');
scene.add(new THREE.HemisphereLight('#ffffff', '#6a6280', 1.3));
const sun = new THREE.DirectionalLight('#fff4e6', 2.4);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun, sun.target);
// Checkered floor, 0.5 m squares.
const c = document.createElement('canvas');
c.width = c.height = 256;
const g = c.getContext('2d');
for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { g.fillStyle = (i + j) % 2 ? '#d9d4e8' : '#bdb6d2'; g.fillRect(i * 32, j * 32, 32, 32); }
const tex = new THREE.CanvasTexture(c);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(50, 50);
tex.colorSpace = THREE.SRGBColorSpace;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
withKtx2(loader);
const gltf = await loader.loadAsync(`/models/${q.get('dir') || 'npcs'}/${name}.glb`);
const model = cloneSkinned(gltf.scene);
model.traverse((o) => o.isMesh && ((o.castShadow = true), (o.frustumCulled = false)));
const root = new THREE.Group();
root.add(model);
root.scale.setScalar(SC);
scene.add(root);
const gait = createGait(model, style, 0.3);
// Where it is at time t (and which way it faces).
function at(t) {
  if (path === 'circle') {
    const R = 6, a = (t * speed) / R;
    return { p: new THREE.Vector3(Math.sin(a) * R, 0, Math.cos(a) * R), yaw: a + Math.PI / 2 };
  }
  if (path === 'stopgo') {
    // Walk 1.5 s, stand 1.5 s, and again.
    const cyc = 3, k = Math.floor(t / cyc), u = t - k * cyc;
    const d = k * 1.5 * speed + Math.min(u, 1.5) * speed - (u > 1.5 ? 0 : 0);
    return { p: new THREE.Vector3(0, 0, d), yaw: 0, still: u > 1.5 };
  }
  return { p: new THREE.Vector3(0, 0, t * speed), yaw: 0 };
}
const cam = new THREE.PerspectiveCamera(30, 1 / 1.2, 0.1, 200);
const DIR = { side: [1, 0.25, 0], front: [0, 0.25, 1], back: [0, 0.3, -1], q: [0.8, 0.35, 0.6] };
const dt = 1 / 60;
let t = 0;
const lastT = Math.max(...ts);
const shots = [];
const dbg = [];
const st = state === 'walk' || state === 'run' ? 'walk' : state;
while (t <= lastT + 1e-6) {
  const a = at(t);
  root.position.copy(a.p);
  root.rotation.y = a.yaw;
  gait.update(dt, path === 'stopgo' && a.still ? 'idle' : st);
  const idx = ts.findIndex((x) => Math.abs(x - t) < dt / 2);
  if (idx >= 0) dbg.push({ t: +t.toFixed(3), ...gait.debug() });
  if (idx >= 0) {
    root.updateMatrixWorld(true);
    const H = 2.2 * SC;
    const look = root.position.clone().add(new THREE.Vector3(0, H * +(q.get('focus') ?? 0.42), 0));
    const d = new THREE.Vector3(...DIR[view]).normalize();
    if (view === 'side' || view === 'front' || view === 'q' || view === 'back') d.applyAxisAngle(new THREE.Vector3(0, 1, 0), root.rotation.y);
    cam.position.copy(look).addScaledVector(d, (H * 2.4) / +(q.get('zoom') ?? 1));
    cam.lookAt(look);
    sun.position.copy(root.position).add(new THREE.Vector3(6, 12, 8));
    sun.target.position.copy(root.position);
    const col = idx % cols, row = Math.floor(idx / cols);
    const y = (rows - 1 - row) * S * 1.2;
    r.setViewport(col * S, y, S, S * 1.2);
    r.setScissor(col * S, y, S, S * 1.2);
    r.render(scene, cam);
  }
  t += dt;
}
document.getElementById('log').textContent = `${name} ${style} speed ${speed} state ${state}`;
window.__json = JSON.stringify(dbg);
requestAnimationFrame(() => (window.__done = r.domElement.toDataURL('image/jpeg', 0.88).split(',')[1]));
</script>

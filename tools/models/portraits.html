<!doctype html><meta charset="utf-8"><title>Cast portraits</title>
<style>body{margin:0;background:#222}canvas{display:block}</style>
<script type="module">
// The guest picker's portraits (public/faces/portraits/<id>.webp, 320 px), animated (the user, 10-17: "the
// character selector should be animated not still images"): each of the cast as the world draws it
// (src/chog.js: its face, its moves) in a loop of its own move, looking out from eye level. One loop of the
// move's clip, FPS frames a second, so it repeats without a seam. Run under vite:
// /tools/models/portraits.html (?only=52&fps=20). window.__shots holds { id: [JPEG data URLs] }; tools write
// them out as animated WebP.
import * as THREE from 'three';
import { makeChog, setChogRenderer, CHOG_HEIGHT } from '/src/chog.js';
const q = new URLSearchParams(location.search);
const FPS = +(q.get('fps') || 20);
// [id, move, face, camera turn (radians, + to its left), camera distance (heights)]
const CAST = [
  [1151, 'talk', 'excited', 0.35],
  [409, 'idle', 'happy', -0.3],
  [68, 'talk', 'curious', -0.35],
  [124, 'idle', 'sleepy', 0.3],
  [132, 'talk', 'excited', 0.25],
  [37, 'talk', 'happy', -0.25],
  [56, 'idle', 'calm', 0.3],
  [66, 'idle', 'excited', -0.3],
  [52, 'talk', 'happy', 0.3],
].filter((c) => !q.get('only') || q.get('only').split(',').includes(String(c[0])));
const S = 320;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(S, S);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.append(renderer.domElement);
setChogRenderer(renderer);
const scene = new THREE.Scene();
scene.background = new THREE.Color('rgb(225, 228, 240)');
scene.add(new THREE.HemisphereLight('#ffffff', '#9a8fb5', 1.9));
const key = new THREE.DirectionalLight('#fff3e6', 2.4);
key.position.set(2.5, 4, 5);
scene.add(key);
const rim = new THREE.DirectionalLight('#c9b8ff', 1.2);
rim.position.set(-3, 3, -4);
scene.add(rim);
const cam = new THREE.PerspectiveCamera(26, 1, 0.05, 60);
const H = CHOG_HEIGHT;
window.__shots = {};
for (const [id, move, face, turn, far = 2.3] of CAST) {
  const c = await makeChog({ model: `models/npcs/chog-${id}.glb` });
  await new Promise((r) => setTimeout(r, 1200));
  scene.add(c.root);
  // Eye level, a little under the face, so it looks out at you (never down).
  cam.position.set(Math.sin(turn) * H * far, H * 0.47, Math.cos(turn) * H * far);
  cam.lookAt(0, H * 0.49, 0);
  c.play(move);
  c.express(face, 1e6);
  // Settled into the move (its fade done, the head turned to you), then one loop of it.
  const len = c.lengthOf(move) || 2;
  for (let k = 0; k < Math.round(len * 60) * 2; k++) c.update(1 / 60, cam);
  const frames = [];
  const n = Math.round(len * FPS);
  for (let f = 0; f < n; f++) {
    for (let k = 0; k < 60 / FPS; k++) c.update(1 / 60, cam);
    renderer.render(scene, cam);
    frames.push(renderer.domElement.toDataURL('image/jpeg', 0.93));
  }
  window.__shots[id] = frames;
  scene.remove(c.root);
}
window.__done = true;
</script>

<!doctype html><meta charset="utf-8"><title>Cast review</title>
<style>body{margin:0;background:#222;color:#eee;font:12px sans-serif}canvas{display:block}</style>
<canvas id="c"></canvas><pre id="log"></pre>
<script type="module">
// Each cast model as the world draws it (makeChog, the Chog shader and its face), one row per model in ?m=,
// one column per view in ?v= (front, back, left, right, q = three-quarter, top), posed in ?clip= at ?t= s.
// ?ts=0,0.2,.. columns are times through the clip instead (one view, ?v=).
// ?size= cell px, ?zoom= closer framing (1 = whole body), ?focus= y to frame (0 feet .. 1 head), ?bg= colour.
// Run under `npx vite`: /tools/models/review.html?m=plain,chog-409&v=front,q,back&clip=idle&t=0.5
import * as THREE from 'three';
import { makeChog } from '/src/chog.js';
const q = new URLSearchParams(location.search);
const names = (q.get('m') || 'plain').split(',');
const ts = q.get('ts')?.split(',').map(Number);
const views = ts ? ts.map(() => (q.get('v') || 'front')) : (q.get('v') || 'front,q,left,back').split(',');
const clip = q.get('clip') || 'idle', at = +(q.get('t') ?? 0.5);
const S = +(q.get('size') || 300), zoom = +(q.get('zoom') || 1), focus = +(q.get('focus') ?? 0.5);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1);
r.setSize(S * views.length, S * 1.25 * names.length);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
r.setScissorTest(true);
const H = S * 1.25;
const DIRS = { front: [0, 0, 1], back: [0, 0, -1], left: [-1, 0, 0], right: [1, 0, 0], q: [0.7, 0.12, 0.7], top: [0, 1, 0.3], ql: [-0.7, 0.12, 0.7], qb: [0.6, 0.15, -0.75] };
const log = [];
const scene = new THREE.Scene();
scene.background = new THREE.Color(q.get('bg') || '#a9b8cc');
scene.add(new THREE.HemisphereLight('#ffffff', '#6a6280', 1.4));
const sun = new THREE.DirectionalLight('#fff4e6', 2.4); sun.position.set(2, 4, 3); scene.add(sun);
const fill = new THREE.DirectionalLight('#cfd8ff', 0.8); fill.position.set(-3, 2, -2); scene.add(fill);
const cam = new THREE.PerspectiveCamera(24, S / H, 0.05, 100);
for (let i = 0; i < names.length; i++) {
  let chog;
  try { chog = await makeChog({ model: `models/${q.get('dir') || 'npcs'}/${names[i]}.glb` }); } catch (e) { log.push(`${names[i]} ERROR ${e.message}`); continue; }
  await new Promise((res) => setTimeout(res, 400)); // the face sheet
  scene.add(chog.root);
  chog.play(clip);
  for (let k = 0; k < 20; k++) chog.update(0.025);
  chog.update(Math.max(0, at - 0.5) + 1e-3);
  chog.root.updateMatrixWorld(true);
  let box0 = null;
  const box = new THREE.Box3().setFromObject(chog.root, true);
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  c.y = box.min.y + size.y * focus;
  const dist = (Math.max(size.y, size.x * 0.9) / zoom) / (2 * Math.tan(THREE.MathUtils.degToRad(12))) * 1.12;
  let tNow = Math.max(0.5, at);
  views.forEach((v, j) => {
    if (ts) { chog.update(Math.max(1e-3, ts[j] - tNow)); tNow = ts[j]; chog.root.updateMatrixWorld(true); }
    const d = new THREE.Vector3(...DIRS[v]).normalize();
    cam.position.copy(c).addScaledVector(d, dist);
    cam.lookAt(c);
    const y = (names.length - 1 - i) * H;
    r.setViewport(j * S, y, S, H); r.setScissor(j * S, y, S, H);
    r.render(scene, cam);
  });
  log.push(`${names[i]} h=${size.y.toFixed(2)} w=${size.x.toFixed(2)} d=${size.z.toFixed(2)}`);
  scene.remove(chog.root);
}
document.getElementById('log').textContent = log.join('\n');
requestAnimationFrame(() => requestAnimationFrame(() => (window.__done = r.domElement.toDataURL('image/jpeg', 0.88).split(',')[1], window.__log = log)));
</script>
